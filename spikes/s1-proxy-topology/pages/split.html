<!doctype html><meta charset="utf-8"><title>split seam blur</title>
<style>body{margin:0;background:#000}</style>
<!-- Row 1 y=0..60: hard red|blue seam at x=100, a backdrop-filter blur over it.
     Row 2 y=60..120: the same seam with a plain CSS filter blur (control).
     Row 3 y=120..180: seam only, no filter (baseline).
     A blurred seam reads purple at x=100; an unblurred one stays pure red/blue. -->
<div style="position:relative;width:200px;height:60px">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#f00 0 50%,#00f 50% 100%)"></div>
  <div style="position:absolute;inset:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)"></div>
</div>
<div style="position:relative;width:200px;height:60px">
  <div style="position:absolute;inset:0;filter:blur(10px);background:linear-gradient(90deg,#f00 0 50%,#00f 50% 100%)"></div>
</div>
<div style="position:relative;width:200px;height:60px">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#f00 0 50%,#00f 50% 100%)"></div>
</div>
