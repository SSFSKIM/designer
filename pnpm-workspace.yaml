packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true

# One version per tool for the whole workspace. Packages reference these with
# "catalog:" so a bump happens in exactly one place.
catalog:
  "@changesets/cli": 3.0.1
  "@eslint/js": 10.0.1
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@vitejs/plugin-react": 6.1.0
  eslint: 10.9.0
  react: 19.2.8
  react-dom: 19.2.8
  tsup: 8.5.1
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  vite: 8.2.2
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.5'
