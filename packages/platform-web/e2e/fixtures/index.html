<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vitrea platform-web — e2e fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      /*
       * The page content the glass samples. Patterned deliberately: a starved
       * blur only goes visibly wrong where the content near a shape edge is
       * busy, so a flat ground would hide the very thing the padding rule is
       * for. The checkerboard is the same 24px cell S1's bench page used.
       */
      #scene {
        position: absolute;
        inset: 0;
        background-color: #3a5a80;
        background-image: linear-gradient(45deg, #1b2b3f 25%, transparent 25%, transparent 75%, #1b2b3f 75%),
          linear-gradient(45deg, #1b2b3f 25%, transparent 25%, transparent 75%, #1b2b3f 75%);
        background-size: 48px 48px;
        background-position: 0 0, 24px 24px;
      }

      /* A focusable element before the planes, so Tab order can be observed. */
      #before {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 2000;
      }

      .glass-host {
        position: absolute;
        display: grid;
        place-items: center;
        margin: 0;
        border: 0;
        background: transparent;
        font: 600 13px/1 system-ui, sans-serif;
        /*
         * The documented pattern an app follows — read the runtime's answer, fall
         * back to the app's own ink where there is none. Written this way rather
         * than as a bare colour so that a tier publishing no foreground shows up
         * here as the fallback rather than as a coincidence.
         */
        color: var(--vitrea-foreground, #fff);
      }

      #scroller {
        position: absolute;
        inset: 0;
        overflow: auto;
      }

      #scroller-content {
        height: 4000px;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="scroller"><div id="scroller-content"></div></div>
    <input id="before" aria-label="before the glass" />
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
