<!doctype html>
<meta charset="utf-8">
<title>W17 G0 cost</title>
<!--
  The synthetic cost page: N surfaces of the calibration bed's own geometry over a
  backdrop that MOVES every frame, so that every frame really re-rasterises the
  filters instead of reusing a cached surface. `form` selects what each surface
  carries: nothing, one `backdrop-filter`, the two-layer body, or the two-layer
  body with a raster `mask-image` on the heavy layer.

  W17 G0 (e) adds one form, `two-ref-mask-ct`: the same two reference filters and
  the same raster mask, with an `feComponentTransfer type="table"` stage appended to each
  filter's chain. That primitive is the conversion's carrier — the intercept and
  the slope the tier's tint composites over — and the question this page answers
  is only whether it moves the knee. The coefficients below are ILLUSTRATIVE and
  are not §4's solve (which came out at slope 1.109-1.132 and intercept -0.187 to
  -0.190): a `type="linear"` transfer is one multiply-add per channel per pixel
  whatever its slope and intercept are, so the cost is the primitive's and not a
  particular cell's, and the run was not repeated when §4's numbers landed.
-->
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#111; }
  #bg { position:fixed; inset:-200px; background-size:32px 32px;
        background-image:
          linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
          linear-gradient(45deg,#000 25%,#fff 25%,#fff 75%,#000 75%);
        background-position:0 0,16px 16px; will-change:transform; }
  .host { position:absolute; isolation:isolate; border-radius:20px;
          background:rgba(255,255,255,.46); border:1px solid rgba(255,255,255,.18); }
  .host > .layer { position:absolute; inset:0; z-index:-1; border-radius:inherit;
                   pointer-events:none; }
</style>
<div id="bg"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const form = q.get("form") ?? "two";
const n = Number(q.get("n") ?? "20");
const W = Number(q.get("w") ?? "160");
const H = Number(q.get("h") ?? "96");
const dpr = window.devicePixelRatio;
const SHARP = 1.25, HEAVY = 1.25 * Math.sqrt(63), SINGLE = 5.53, SHARE = 0.489;

/*
 * The linear-light form (W16 G0 §1.3): the same two widths drawn as SVG reference
 * filters whose `color-interpolation-filters` is `linearRGB`, which is the only
 * measured form that reaches the reference's body. One filter per width for the
 * whole page — every surface here carries the same two — so the count below is
 * the cost of the FORM and not of a filter per element.
 */
const NS = "http://www.w3.org/2000/svg";
const defs = document.createElementNS(NS, "svg");
defs.setAttribute("width", "0");
defs.setAttribute("height", "0");
defs.style.position = "absolute";
for (const [id, sigma] of [["refSharp", SHARP], ["refHeavy", HEAVY], ["refSingle", SINGLE]]) {
  const f = document.createElementNS(NS, "filter");
  f.setAttribute("id", id);
  f.setAttribute("x", "-50%"); f.setAttribute("y", "-50%");
  f.setAttribute("width", "200%"); f.setAttribute("height", "200%");
  f.setAttribute("color-interpolation-filters", "linearRGB");
  const b = document.createElementNS(NS, "feGaussianBlur");
  b.setAttribute("stdDeviation", String(sigma));
  f.append(b);
  // the same `saturate(1.5)` the `blur()` form carries, so the two columns differ
  // in the operator's colour space and in nothing else
  const c = document.createElementNS(NS, "feColorMatrix");
  c.setAttribute("type", "saturate");
  c.setAttribute("values", "1.5");
  f.append(c);
  defs.append(f);
}
document.body.append(defs);
/** `blur()` or the reference filter of the same width, by the form's suffix. */
const ref = form.startsWith("one-ref") || form.startsWith("two-ref");

/*
 * The conversion's carrier, appended to every reference filter's chain when the
 * form asks for it. `type="linear"` is one multiply-add per channel per pixel —
 * the cheapest transfer the primitive has — and it is inserted AFTER the blur
 * and the saturation, which is where the tier's own solve puts it: it operates
 * on the filtered backdrop, before the tint composites over the result.
 */
if (form.endsWith("-ct")) {
  // The 33 values `cssTierTintTable` settles at for the shipped profile's regular
  // material over a mid backdrop, at the floor the doctrine keeps — the count is
  // the interpolation bound's and the values are one real cell's. A table's cost
  // is its length and its interpolation, not what is in it.
  const TABLE_VALUES = "0.301841 0.319445 0.33726 0.355277 0.373488 0.391884 0.410458 0.429203 0.448112 0.46718 0.4864 0.505767 0.525277 0.544923 0.564703 0.58461 0.604643 0.624796 0.645066 0.66545 0.685944 0.706545 0.727251 0.748058 0.768964 0.789966 0.811062 0.832249 0.853526 0.874889 0.896337 0.917868 0.93948";
  for (const id of ["refSharp", "refHeavy", "refSingle"]) {
    const f = document.getElementById(id);
    if (f === null) continue;
    const t = document.createElementNS(NS, "feComponentTransfer");
    for (const channel of ["feFuncR", "feFuncG", "feFuncB"]) {
      const fn = document.createElementNS(NS, channel);
      // W17 G1's landed carrier is a TABLE, not the linear stage G0 measured
      // (Decision Log 4 (a)): under an encoded overlay at the floor the
      // remainder carries both transfer functions and is curved. A table is a
      // lookup and an interpolate rather than a multiply-add, so the cost
      // question has to be re-asked on the primitive that ships. The 33 values
      // are the count the interpolation bound settles at on the shipped profile
      // over a mid backdrop; a table's cost does not depend on what is in it.
      fn.setAttribute("type", "table");
      fn.setAttribute("tableValues", TABLE_VALUES);
      t.append(fn);
    }
    f.append(t);
  }
}

function rasterMask(w, h, r) {
  const c = document.createElement("canvas");
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(c.width, c.height);
  for (let py = 0; py < c.height; py += 1) for (let px = 0; px < c.width; px += 1) {
    const x = (px + 0.5) / dpr, y = (py + 0.5) / dpr;
    const ax = Math.abs(x - w / 2) - (w / 2 - r), ay = Math.abs(y - h / 2) - (h / 2 - r);
    const u = -(Math.hypot(Math.max(ax, 0), Math.max(ay, 0)) + Math.min(Math.max(ax, ay), 0) - r);
    const o = (py * c.width + px) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = 255;
    img.data[o + 3] = Math.round(255 * Math.min(1, Math.max(0, 0.48 + 0.04 * Math.min(1, u / 80))));
  }
  ctx.putImageData(img, 0, 0);
  return `url("${c.toDataURL()}")`;
}

const cols = Math.ceil(Math.sqrt(n));
for (let i = 0; i < n; i += 1) {
  const host = document.createElement("div");
  host.className = "host";
  host.style.width = `${W}px`; host.style.height = `${H}px`;
  host.style.left = `${20 + (i % cols) * (W + 16)}px`;
  host.style.top = `${20 + Math.floor(i / cols) * (H + 16)}px`;
  const layer = (s, id) => {
    const el = document.createElement("div");
    el.className = "layer";
    el.style.backdropFilter = ref ? `url(#${id})` : `blur(${s}px) saturate(1.5)`;
    return el;
  };
  if (form === "one" || form === "one-ref") {
    host.style.backdropFilter = ref ? "url(#refSingle)" : `blur(${SINGLE}px) saturate(1.5)`;
  } else if (form.startsWith("two")) {
    host.append(layer(SHARP, "refSharp"));
    const heavy = layer(HEAVY, "refHeavy");
    if (form.includes("-mask")) {
      const m = rasterMask(W, H, 20);
      heavy.style.maskImage = m; heavy.style.maskMode = "alpha";
      heavy.style.maskSize = "100% 100%"; heavy.style.maskRepeat = "no-repeat";
    } else heavy.style.opacity = String(SHARE);
    host.append(heavy);
  }
  document.body.append(host);
}

const bg = document.getElementById("bg");
let t = 0;
const samples = [];
let last = performance.now();
function frame(now) {
  t += 1;
  bg.style.transform = `translate(${(t % 64) - 32}px, ${((t * 7) % 64) - 32}px)`;
  samples.push(now - last);
  last = now;
  if (samples.length < 240) requestAnimationFrame(frame);
  else {
    const warm = samples.slice(60).sort((a, b) => a - b);
    window.__cost = {
      form, n, w: W, h: H, dpr,
      frames: warm.length,
      medianMs: warm[Math.floor(warm.length / 2)],
      p90Ms: warm[Math.floor(warm.length * 0.9)],
      minMs: warm[0],
      meanMs: warm.reduce((a, b) => a + b, 0) / warm.length,
      fps: 1000 / (warm.reduce((a, b) => a + b, 0) / warm.length),
    };
    document.documentElement.dataset.done = "1";
  }
}
requestAnimationFrame(frame);
</script>
